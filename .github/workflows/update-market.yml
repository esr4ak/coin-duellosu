name: Günlük piyasa verisi
on:
  schedule:
    - cron: '5 21 * * *'   # Her gün 00.05 (TSİ)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Veriyi güncelle
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: node tools/update-market.mjs
      - name: Değişiklik varsa kaydet
        run: |
          if git diff --quiet; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Piyasa verisi $(TZ=Europe/Istanbul date +%F)"
          git push
