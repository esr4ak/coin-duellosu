name: Günlük piyasa verisi
on:
  schedule:
    - cron: '0 15 * * *'   # Her gün 18.00 (TSİ): ertesi günün verisi hazırlanır
  workflow_dispatch:
    inputs:
      hedef_gun:
        description: 'Veri hangi gün için? (YYYY-AA-GG, boş = otomatik)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Veriyi güncelle
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TARGET_DATE: ${{ github.event.inputs.hedef_gun }}
        run: node tools/update-market.mjs
      - name: Değişiklik varsa kaydet
        run: |
          if git diff --quiet; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "Piyasa verisi $(TZ=Europe/Istanbul date +%F)"
          git push
